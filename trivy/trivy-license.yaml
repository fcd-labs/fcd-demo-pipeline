# License policy of the security gate (fcd-mvp0.md). Trivy severity per category:
# forbidden = CRITICAL, restricted = HIGH, reciprocal = MEDIUM, notice/permissive/unencumbered = LOW, unknown = UNKNOWN.
# Libraries: only LOW passes. OS packages of the base image: only forbidden stops (GPL is allowed there).
license:
  forbidden:
    - AGPL-1.0
    - AGPL-3.0
    - AGPL-3.0-only
    - AGPL-3.0-or-later
    - SSPL-1.0
    - BUSL-1.1
    - CC-BY-NC-4.0
    - Commons-Clause
  restricted:
    - GPL-1.0
    - GPL-2.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-2.0-with-classpath-exception
    - GPL-3.0
    - GPL-3.0-only
    - GPL-3.0-or-later
  reciprocal: []
  notice:
    - MPL-2.0
    - EPL-1.0
    - EPL-2.0
    - LGPL-2.0
    - LGPL-2.1
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0
    - LGPL-3.0-only
    - LGPL-3.0-or-later
  permissive:
    - MIT
    - MIT-0
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - Zlib
  unencumbered:
    - Unlicense
    - CC0-1.0
    - 0BSD
